name: CI

on:
  workflow_call:
    inputs:
      platforms:
        description: 'Comma-separated integration test platforms: web, linux, android, ios, macos, windows'
        required: true
        type: string
      integration-test-working-directory:
        description: 'Directory containing the integration test Flutter app'
        type: string
        default: example
      integration-test-target:
        description: 'Integration test file relative to the working directory'
        type: string
        default: integration_test/app_test.dart
      integration-test-driver:
        description: 'Web integration test driver file'
        type: string
        default: test_driver/integration_test.dart

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect Integration Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      integration: ${{ steps.filter.outputs.integration }}
      platforms: ${{ inputs.platforms }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@15192bc058cc28a13dbf6cde61f19e18988b7af6 # v3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            integration:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE'

  test:
    name: Test & Analyze
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.integration == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout shared actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Tkko/better-actions
          ref: ${{ job.workflow_sha }}
          path: .github/workflow-actions
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: ./.github/workflow-actions/.github/actions/validate-package
        with:
          run-publish-dry-run: ${{ github.event_name == 'workflow_dispatch' }}
          run-pana: ${{ github.event_name == 'workflow_dispatch' }}

  integration-tests:
    name: Integration Tests
    needs: changes
    uses: Tkko/better-actions/.github/workflows/integration-tests.yml@main
    with:
      platforms: ${{ needs.changes.outputs.platforms }}
      integration-test-working-directory: ${{ inputs.integration-test-working-directory || 'example' }}
      integration-test-target: ${{ inputs.integration-test-target || 'integration_test/app_test.dart' }}
      integration-test-driver: ${{ inputs.integration-test-driver || 'test_driver/integration_test.dart' }}
      run-web-linux: ${{ github.event_name != 'pull_request' || needs.changes.outputs.integration == 'true' }}

  required:
    name: CI required
    needs: [changes, test, integration-tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check required jobs
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          RUN_TEST: ${{ github.event_name != 'pull_request' || needs.changes.outputs.integration == 'true' }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          expected = {"changes": "success"}
          expected["test"] = "success" if os.environ["RUN_TEST"] == "true" else "skipped"
          expected["integration-tests"] = "success"
          results = json.loads(os.environ["JOB_RESULTS"])
          failed = False
          for job, status in expected.items():
              actual = results[job]["result"]
              if actual != status:
                  print(f"::error::{job}: expected {status}, got {actual}")
                  failed = True
          sys.exit(1 if failed else 0)
          PY
