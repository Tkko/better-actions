name: Create Release & Tag

on:
  workflow_call:
    inputs:
      tag_name:
        description: Requested release tag; empty derives it from pubspec.yaml
        required: false
        type: string
        default: ''
      dry_run:
        description: Validate without creating a tag or release
        required: false
        type: boolean
        default: false
      platforms:
        description: 'Comma-separated integration test platforms to pass before releasing: web, linux, android, ios, macos, windows'
        required: true
        type: string
      working-directory:
        description: Directory containing pubspec.yaml
        required: false
        type: string
        default: .
      integration-test-working-directory:
        description: Directory containing the integration test Flutter app
        required: false
        type: string
        default: example
      integration-test-target:
        description: Integration test file relative to the working directory
        required: false
        type: string
        default: integration_test/app_test.dart
      integration-test-driver:
        description: Web integration test driver file
        required: false
        type: string
        default: test_driver/integration_test.dart
      publish-workflow:
        description: Publishing workflow file to dispatch after creating the release
        required: false
        type: string
        default: publish.yml

concurrency:
  group: create-release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve Release Commit & Tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.metadata.outputs.sha }}
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - name: Checkout release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout shared actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Tkko/better-actions
          ref: ${{ job.workflow_sha }}
          path: .github/workflow-actions
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - id: metadata
        uses: ./.github/workflow-actions/.github/actions/release-metadata
        with:
          tag-name: ${{ inputs.tag_name }}
          working-directory: ${{ inputs.working-directory }}

  validate:
    name: Validate Release Commit
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Checkout shared actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Tkko/better-actions
          ref: ${{ job.workflow_sha }}
          path: .github/workflow-actions
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: ./.github/workflow-actions/.github/actions/validate-package
        with:
          working-directory: ${{ inputs.working-directory }}
          run-publish-dry-run: 'true'
          run-pana: 'true'

  integration-tests:
    name: Integration Tests
    needs: prepare
    uses: Tkko/better-actions/.github/workflows/integration-tests.yml@main
    with:
      platforms: ${{ inputs.platforms }}
      integration-test-working-directory: ${{ inputs.integration-test-working-directory }}
      integration-test-target: ${{ inputs.integration-test-target }}
      integration-test-driver: ${{ inputs.integration-test-driver }}
      checkout-ref: ${{ needs.prepare.outputs.sha }}
      ios-timeout-minutes: 45

  release:
    name: Create Release & Tag
    needs: [prepare, validate, integration-tests]
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.integration-tests.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Checkout shared actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Tkko/better-actions
          ref: ${{ job.workflow_sha }}
          path: .github/workflow-actions
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: ./.github/workflow-actions/.github/actions/create-release
        with:
          release-tag: ${{ needs.prepare.outputs.tag }}
          release-sha: ${{ needs.prepare.outputs.sha }}
          dry_run: ${{ inputs.dry_run }}
          publish-workflow: ${{ inputs.publish-workflow }}
