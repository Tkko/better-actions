name: Set up Flutter package
description: Install the Flutter SDK with caching and resolve package dependencies

inputs:
  flutter-version:
    description: Flutter SDK version override; empty reads the version from .fvmrc in the repository root
    required: false
    default: ''
  flutter-channel:
    description: Flutter SDK channel; used when the version is empty and .fvmrc does not name a channel
    required: false
    default: stable
  working-directory:
    description: Package or app directory in the calling repository
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - name: Resolve Flutter version
      id: flutter
      shell: bash
      env:
        VERSION_INPUT: ${{ inputs.flutter-version }}
        CHANNEL_INPUT: ${{ inputs.flutter-channel }}
      run: |
        # FVM allows "3.47.9", "3.47.9@beta" or a bare channel such as "stable".
        version="$VERSION_INPUT"
        channel="$CHANNEL_INPUT"
        if [ -z "$version" ]; then
          if [ -f "$GITHUB_WORKSPACE/.fvmrc" ]; then
            version=$(jq -r '.flutter // empty' "$GITHUB_WORKSPACE/.fvmrc")
          else
            echo "::warning::No flutter-version input and no .fvmrc; using the latest $channel release."
          fi
        fi
        case "$version" in
          stable|beta|master|main) channel="${version/main/master}"; version='' ;;
          *@*) channel="${version#*@}"; version="${version%@*}" ;;
        esac
        echo "Flutter version: ${version:-latest} (channel: $channel)"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "channel=$channel" >> "$GITHUB_OUTPUT"

    - name: Cache Flutter SDK
      id: sdk-cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.tool_cache }}/flutter-sdk
        key: flutter-sdk-${{ runner.os }}-${{ runner.arch }}-${{ steps.flutter.outputs.version || steps.flutter.outputs.channel }}

    - name: Install Flutter SDK
      if: steps.sdk-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        FLUTTER_REF: ${{ steps.flutter.outputs.version || steps.flutter.outputs.channel }}
        SDK_DIR: ${{ runner.tool_cache }}/flutter-sdk
      run: |
        rm -rf "$SDK_DIR"
        git clone --depth 1 --branch "$FLUTTER_REF" https://github.com/flutter/flutter.git "$SDK_DIR"

    - name: Add Flutter to PATH
      shell: bash
      env:
        SDK_DIR: ${{ runner.tool_cache }}/flutter-sdk
      run: |
        bin="$SDK_DIR/bin"
        if command -v cygpath >/dev/null 2>&1; then bin=$(cygpath -w "$bin"); fi
        echo "$bin" >> "$GITHUB_PATH"
        "$SDK_DIR/bin/flutter" --version

    - name: Install dependencies
      shell: bash
      run: flutter pub get
      working-directory: ${{ inputs.working-directory }}
