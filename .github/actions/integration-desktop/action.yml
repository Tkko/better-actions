name: Run desktop integration tests
description: Run Flutter integration tests and upload failure diagnostics on desktop
inputs:
  integration-test-working-directory:
    description: Directory containing the integration test Flutter app
    required: false
    default: example
  integration-test-target:
    description: Target test file path relative to integration-test-working-directory
    required: false
    default: integration_test/app_test.dart
  platform:
    description: Desktop platform (macos or windows)
    required: true
runs:
  using: composite
  steps:
    - name: Set up Flutter package
      uses: ./.github/workflow-actions/.github/actions/setup-flutter
      with:
        working-directory: ${{ inputs.integration-test-working-directory }}
    - name: Run Desktop Integration Tests
      shell: bash
      env:
        INTEGRATION_TEST_TARGET: ${{ inputs.integration-test-target }}
        PLATFORM: ${{ inputs.platform }}
      run: flutter test "$INTEGRATION_TEST_TARGET" -d "$PLATFORM" --reporter expanded --verbose 2>&1 | tee "$RUNNER_TEMP/$PLATFORM-tests.log"
      working-directory: ${{ inputs.integration-test-working-directory }}
    - name: Upload failure diagnostics
      if: ${{ failure() || cancelled() }}
      uses: ./.github/workflow-actions/.github/actions/upload-test-diagnostics
      with:
        name: "${{ inputs.platform }}-test-diagnostics"
        path: "${{ runner.temp }}/${{ inputs.platform }}-tests.log"
