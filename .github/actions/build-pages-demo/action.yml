name: Build Pages demo
description: Build the Flutter web demo and upload it as the GitHub Pages artifact
inputs:
  flutter-version:
    description: Flutter SDK version override; empty reads the version from .fvmrc
    required: false
    default: ''
  flutter-channel:
    description: Flutter SDK channel; used when the version is empty and .fvmrc does not name a channel
    required: false
    default: stable
  working-directory:
    description: Directory containing the Flutter demo app
    required: false
    default: example
runs:
  using: composite
  steps:
    - name: Configure Pages
      id: pages
      uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
    - name: Set up Flutter package
      uses: ./.github/workflow-actions/.github/actions/setup-flutter
      with:
        flutter-channel: ${{ inputs.flutter-channel }}
        flutter-version: ${{ inputs.flutter-version }}
        working-directory: ${{ inputs.working-directory }}
    - name: Build demo
      env:
        BASE_PATH: ${{ steps.pages.outputs.base_path }}
      run: flutter build web --release --target=lib/demo/demo.dart --base-href="$BASE_PATH/"
      working-directory: ${{ inputs.working-directory }}
      shell: bash
    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: "${{ inputs.working-directory }}/build/web"
