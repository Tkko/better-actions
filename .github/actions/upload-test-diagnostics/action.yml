name: Upload test diagnostics
description: Upload test logs and failure artifacts
inputs:
  name:
    description: Artifact name
    required: true
  path:
    description: File or files to upload
    required: true
runs:
  using: composite
  steps:
    - name: Upload test diagnostics
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        retention-days: 7
        if-no-files-found: warn
