name: Publish package
description: Publish the package to pub.dev through OIDC; callers validate and dry-run beforehand
inputs:
  flutter-version:
    description: Flutter SDK version override; empty reads the version from .fvmrc
    required: false
    default: ''
  flutter-channel:
    description: Flutter SDK channel; used when the version is empty and .fvmrc does not name a channel
    required: false
    default: stable
  working-directory:
    description: Directory containing the package
    required: false
    default: '.'
runs:
  using: composite
  steps:
    - name: Configure pub.dev OIDC authentication
      uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1
      with:
        sdk: 3.13.7
    - name: Set up Flutter package
      uses: ./.github/workflow-actions/.github/actions/setup-flutter
      with:
        flutter-channel: ${{ inputs.flutter-channel }}
        flutter-version: ${{ inputs.flutter-version }}
        working-directory: ${{ inputs.working-directory }}
    - name: Publish to pub.dev
      run: flutter pub publish --force
      working-directory: ${{ inputs.working-directory }}
      shell: bash
