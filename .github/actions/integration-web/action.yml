name: Run Web integration tests
description: Run Flutter integration tests and upload failure diagnostics on web
inputs:
  integration-test-working-directory:
    description: Directory containing the integration test Flutter app
    required: false
    default: example
  integration-test-target:
    description: Target test file path relative to integration-test-working-directory
    required: false
    default: integration_test/app_test.dart
  integration-test-driver:
    description: Driver file path relative to integration-test-working-directory
    required: false
    default: test_driver/integration_test.dart
runs:
  using: composite
  steps:
    - name: Set up Flutter package
      uses: ./.github/workflow-actions/.github/actions/setup-flutter
      with:
        working-directory: ${{ inputs.integration-test-working-directory }}
    - name: Launch Chromedriver
      shell: bash
      run: |
        # ubuntu runners ship Chrome and a matching chromedriver
        "$CHROMEWEBDRIVER/chromedriver" --port=4444 > "$RUNNER_TEMP/chromedriver.log" 2>&1 &
        curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 --max-time 2 \
          http://127.0.0.1:4444/status | jq -e '.value.ready == true'
    - name: Run Web Integration Tests
      shell: bash
      env:
        INTEGRATION_TEST_DRIVER: ${{ inputs.integration-test-driver }}
        INTEGRATION_TEST_TARGET: ${{ inputs.integration-test-target }}
      run: flutter drive --driver="$INTEGRATION_TEST_DRIVER" --target="$INTEGRATION_TEST_TARGET" -d web-server --headless --browser-name=chrome --timeout=120 --verbose 2>&1 | tee "$RUNNER_TEMP/web-tests.log"
      working-directory: ${{ inputs.integration-test-working-directory }}
    - name: Upload failure diagnostics
      if: ${{ failure() || cancelled() }}
      uses: ./.github/workflow-actions/.github/actions/upload-test-diagnostics
      with:
        name: web-test-diagnostics
        path: |
          ${{ runner.temp }}/web-tests.log
          ${{ runner.temp }}/chromedriver.log
